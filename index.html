<!DOCTYPE html>
<html>
<head>
<title>Ride System</title>

<style>
body{
    background:#0b1b2b;
    color:white;
    font-family:Arial;
    padding:30px;
}
button{
    background:#eaff00;
    border:none;
    padding:10px 20px;
    margin:10px;
    cursor:pointer;
}
.card{
    background:#1e2d3f;
    padding:15px;
    margin-top:15px;
    border-radius:10px;
}
.hidden{ display:none; }
input, select{
    padding:8px;
    margin:5px;
}
</style>

</head>

<body>

<h1>Ride System</h1>

<!-- LOGIN -->
<div id="login">
    <button onclick="showRider()">Login as Rider</button>
    <button onclick="showDriver()">Login as Driver</button>
</div>

<!-- RIDER LOGIN -->
<div id="riderLogin" class="hidden">
    <h3>Rider Login</h3>
    <input id="name" placeholder="Name"><br>
    <input id="email" placeholder="Email"><br>
    <input id="phone" placeholder="Phone"><br>
    <button onclick="loginRider()">Login</button>
</div>

<!-- RIDER DASHBOARD -->
<div id="riderDash" class="hidden">
    <h3>Rider Dashboard</h3>
    <button onclick="showCommute()">Commute Pass</button>
    <button onclick="bookInstant()">Normal Booking</button>

    <div id="commuteBox" class="card hidden">

        <select id="pickup">
            <option>Whitefield</option>
            <option>Koramangala</option>
            <option>Indiranagar</option>
            <option>BTM</option>
            <option>Jayanagar</option>
            <option>Electronic City</option>
        </select>

        <select id="drop">
            <option>MG Road</option>
            <option>Hebbal</option>
            <option>Marathahalli</option>
            <option>Yelahanka</option>
        </select>

        <br>

        Pickup Time:
        <input type="time" id="pickupTime"><br>

        Return Time:
        <input type="time" id="returnTime"><br>

        Ride Type:
        <select id="rideType">
            <option value="one">One Way</option>
            <option value="two">Two Way</option>
        </select>

        <br>

        <input type="checkbox" id="weekend"> Include Weekends

        <br>

        <button onclick="calc()">Calculate</button>
        <div id="price"></div>

        <button onclick="confirmRide()">Confirm</button>

    </div>

    <div id="myrides"></div>

</div>

<!-- DRIVER LOGIN -->
<div id="driverLogin" class="hidden">
    <h3>Driver Login</h3>
    <input id="dname" placeholder="Name"><br>
    <input id="demail" placeholder="Email"><br>
    <input id="dphone" placeholder="Phone"><br>
    <input id="vehicle" placeholder="Vehicle"><br>
    <button onclick="loginDriver()">Login</button>
</div>

<!-- DRIVER DASHBOARD -->
<div id="driverDash" class="hidden">
    <h3>Driver Dashboard</h3>
    <button onclick="loadRides()">View Rides</button>
    <div id="rides"></div>
</div>

<script>
const BASE = "http://127.0.0.1:8001";

let driver = { name:"", vehicle:"" };
let rideCreated = false;

// =====================
// LOGIN
// =====================
function showRider() {
  const login = document.getElementById("login");
  const rider = document.getElementById("riderLogin");

  if (!login || !rider) {
    console.error("Element missing:", { login, rider });
    return;
  }

  login.style.display = "none";
  rider.classList.remove("hidden");
}

function showDriver() {
  const login = document.getElementById("login");
  const driver = document.getElementById("driverLogin");

  if (!login || !driver) {
    console.error("Element missing:", { login, driver });
    return;
  }

  login.style.display = "none";
  driver.classList.remove("hidden");
}
async function loadMyRides(){
    let res = await fetch(`${BASE}/user/rides?user_id=${rider.user_id}`);
    let data = await res.json();

    let container = document.getElementById("myrides");
    container.innerHTML = "<h4>My Ride</h4>";

    // 🚨 if no rides
    if(data.length === 0){
        container.innerHTML += `<div class="card">No rides booked yet</div>`;
        return;
    }

    // 🔥 show ONLY ONE (latest ride for clean UI)
    let r = data[data.length - 1];

    container.innerHTML += `
        <div class="card">
            <b>${r.pickup} → ${r.drop}</b><br>
            Time: ${r.time} | ${r.date}<br>
            Type: ${r.type}<br>
            Status: ${r.status}<br>

            ${
                r.status === "ACCEPTED"
                ? `<span style="color:lightgreen">
                    Driver: ${r.driver} 🚗 (${r.vehicle})
                  </span>`
                : `<span style="color:orange">Waiting for driver...</span>`
            }
        </div>
    `;
}
async function loadDriverRides() {
    let res = await fetch(`${BASE}/match/rides`);
    let data = await res.json();

    let box = document.getElementById("driverRides");
    box.innerHTML = "";

    data.forEach(r => {
        box.innerHTML += `
        <div>
            Ride ID: ${r.ride_id} <br>
            User: ${r.name} <br>
            Status: ${r.status} <br>

            ${
                r.status === "PENDING"
                ? `<button onclick="acceptRide(${r.ride_id})">Accept</button>`
                : `<span style="color:lightgreen">Accepted</span>`
            }
        </div><br>`;
    });
}
async function loadRides(){
    try{
        let res = await fetch(BASE + "/match/rides");
        let data = await res.json();

        let container = document.getElementById("rides");
        container.innerHTML = "";

        // 🔥 remove duplicates
        let unique = {};
        data.forEach(r => {
            unique[r.ride_id] = r;
        });

        let rides = Object.values(unique);

        rides.forEach(r => {
            container.innerHTML += `
                <div style="margin:10px;padding:10px;background:#1f2c3d;border-radius:8px">
                    <b>Ride ID:</b> ${r.ride_id} <br>
                    <b>User:</b> ${r.name} <br>
                    <b>Route:</b> ${r.pickup} → ${r.drop} <br>
                    <b>Time:</b> ${r.time} <br>
                    <b>Type:</b> ${r.type} <br>
                    <b>Priority:</b> ${r.priority} <br>
                    <b>Status:</b> ${r.status} <br>

                    ${
                        r.status === "PENDING"
                        ? `<button onclick="acceptRide(${r.ride_id})">Accept</button>`
                        : `<span style="color:lightgreen">Accepted</span>`
                    }
                </div>
            `;
        });

    }catch(err){
        console.log(err);
    }
}
async function acceptRide(id) {
    await fetch(`${BASE}/accept/${id}?driver_name=${driver.name}&vehicle=${driver.vehicle}`, {
        method: "POST"
    });

    // 🔥 THIS IS THE FIX
    loadRides(); 
}

let rider = { user_id: 0, name: "" };

async function loginRider(){
    if(rider.user_id){
        document.getElementById("riderLogin").classList.add("hidden");
        document.getElementById("riderDash").classList.remove("hidden");
        loadMyRides();
        return;
    }
    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let phone = document.getElementById("phone").value;

    let res = await fetch(`${BASE}/create-user?name=${name}&email=${email}&phone=${phone}`, {
        method: "POST"
    });

    let data = await res.json();

    rider.user_id = data.id;   // 🔥 REAL USER ID FROM DB
    rider.name = name;

    document.getElementById("riderLogin").classList.add("hidden");
    document.getElementById("riderDash").classList.remove("hidden");
    loadMyRides();
}

function loginDriver(){
    driver.name = document.getElementById("dname").value;
    driver.vehicle = document.getElementById("vehicle").value;

    document.getElementById("driverLogin").classList.add("hidden");
    document.getElementById("driverDash").classList.remove("hidden");
    loadDriverRides();
}

function showCommute(){
    document.getElementById("commuteBox").classList.remove("hidden");
}

async function bookInstant(){
    try{
        let pickup = document.getElementById("pickup").value;
        let drop = document.getElementById("drop").value;

        let res = await fetch(
            `${BASE}/book/instant?user_id=${rider.user_id}&pickup=${pickup}&drop=${drop}`,
            { method: "POST" }
        );

        let data = await res.json();
        alert("Instant Ride Booked 🚗");
        loadMyRides();

    }catch(err){
        console.log(err);
        alert("Instant booking failed");
    }
}

// =====================
// CALCULATE (FIXED)
// =====================
async function calc(){
    let pickup = document.getElementById("pickup").value;
    let drop = document.getElementById("drop").value;
    let weekend = document.getElementById("weekend").checked;

    let res = await fetch(`${BASE}/calculate-price?pickup=${pickup}&drop=${drop}&weekend=${weekend}`);
    let data = await res.json();

    document.getElementById("price").innerText =
        `Distance: ${data.distance_km} km | ₹${data.monthly_price}`;
}

// =====================
// CONFIRM (FIXED)
// =====================
async function confirmRide(){

    if(rideCreated){
        alert("Ride already booked!");
        return;
    }

    let pickup = document.getElementById("pickup").value;
    let drop = document.getElementById("drop").value;
    let time = document.getElementById("pickupTime").value;
    let returnTime = document.getElementById("returnTime").value;
    let type = document.getElementById("rideType").value;

    try{
        let res = await fetch(
            `${BASE}/schedule/monthly?user_id=${rider.user_id}&pickup=${pickup}&drop=${drop}&pickup_time=${time}&return_time=${returnTime}&ride_mode=${type}`,
            { method: "POST" }
        );

        let data = await res.json();

        rideCreated = true; // 🔥 THIS STOPS DUPLICATES

        alert("Commute Scheduled 🚗");
        loadMyRides();

    }catch(err){
        console.log(err);
        alert("Error booking ride");
    }
}

setInterval(() => {
    if(rider.user_id){
        loadMyRides();
    }
}, 3000); // refresh every 3 sec

</script>

</body>
</html>
